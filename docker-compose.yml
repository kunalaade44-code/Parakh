version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dogfood-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./dogfood.db
      - SECRET_KEY=dogfood-production-secret-offline-2026
    volumes:
      - ./dogfood.db:/app/dogfood.db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dogfood-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
